# Schema, same as order/up.sql. Postgres runs it only when the data volume is empty.
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-db-init
data:
  1.sql: |
    CREATE TABLE IF NOT EXISTS orders (
      id CHAR(27) PRIMARY KEY,
      created_at TIMESTAMP WITH TIME ZONE NOT NULL,
      account_id CHAR(27) NOT NULL,
      total_price MONEY NOT NULL
    );

    CREATE TABLE IF NOT EXISTS order_products (
      order_id CHAR(27) REFERENCES orders (id) ON DELETE CASCADE,
      product_id CHAR(27),
      quantity INT NOT NULL,
      PRIMARY KEY (product_id, order_id)
    );

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: order-db-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: order-db
  labels:
    app: order-db
spec:
  serviceName: order-db-service
  replicas: 1
  selector:
    matchLabels:
      app: order-db
  template:
    metadata:
      labels:
        app: order-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: order-db-secret
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: order-db-storage
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - order_db
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - order_db
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: order-db-storage
          persistentVolumeClaim:
            claimName: order-db-pvc
        - name: init-sql
          configMap:
            name: order-db-init

---
apiVersion: v1
kind: Service
metadata:
  name: order-db-service
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: order-db
  type: ClusterIP
