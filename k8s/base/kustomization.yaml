# Base manifests for the shop. Image tags are bumped by the Jenkins pipelines.
# The ECR registry (contains the AWS account ID) is NOT here: the Argo CD Application
# sets it from the bastion (scripts/create-argocd-app.sh), so it never enters git.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: go-micro-shop

resources:
  - namespace.yaml
  - secret-store.yaml
  - databases/account-db.yaml
  - databases/catalog-db.yaml
  - databases/order-db.yaml
  - microservices/account-service.yaml
  - microservices/catalog-service.yaml
  - microservices/order-service.yaml
  - gateway/graphql-gateway.yaml
  - gateway/frontend.yaml
  - ingress/ingress.yaml

images:
  - name: account
    newTag: "0"
  - name: catalog
    newTag: "0"
  - name: order
    newTag: "0"
  - name: graphql
    newTag: "0"
  - name: frontend
    newTag: "0"
