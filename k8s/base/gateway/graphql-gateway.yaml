apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphql-gateway
  labels:
    app: graphql-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: graphql-gateway
  template:
    metadata:
      labels:
        app: graphql-gateway
    spec:
      containers:
        - name: graphql-gateway
          image: graphql
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ACCOUNT_SERVICE_URL
              value: "account-service:8080"
            - name: CATALOG_SERVICE_URL
              value: "catalog-service:8080"
            - name: ORDER_SERVICE_URL
              value: "order-service:8080"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          # The server only serves /graphql and /playground; / returns 404
          readinessProbe:
            httpGet:
              path: /playground
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /playground
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  # Named "graphql" because frontend/nginx.conf proxies to http://graphql:8080
  name: graphql
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /playground
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: graphql-gateway
  type: ClusterIP
