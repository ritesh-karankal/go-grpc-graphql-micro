apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphql-gateway
  labels:
    app: graphql-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: graphql-gateway
  template:
    metadata:
      labels:
        app: graphql-gateway
      # Scraped by the prometheus-community/prometheus chart (kubernetes-pods job)
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: /metrics
    spec:
      # preStop sleep (15s) + draining in-flight requests (up to 10s, lifecycle.DrainTimeout)
      # + flushing telemetry (up to 5s) must fit in here
      terminationGracePeriodSeconds: 30
      containers:
        - name: graphql-gateway
          image: graphql
          imagePullPolicy: IfNotPresent
          # Keep serving while the load balancer and Service endpoints stop routing here;
          # SIGTERM (and draining) only starts after this
          lifecycle:
            preStop:
              sleep:
                seconds: 15
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9464
              name: metrics
          # OTEL_EXPORTER_OTLP_ENDPOINT and DEPLOYMENT_ENVIRONMENT (k8s/base/kustomization.yaml)
          envFrom:
            - configMapRef:
                name: otel-config
          env:
            - name: ACCOUNT_SERVICE_URL
              value: "account-service-headless:8080"
            - name: CATALOG_SERVICE_URL
              value: "catalog-service-headless:8080"
            - name: ORDER_SERVICE_URL
              value: "order-service-headless:8080"
            # Tag every span, metric and log with where it came from. SigNoz filters and
            # groups by deployment.environment (not the newer deployment.environment.name)
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=$(DEPLOYMENT_ENVIRONMENT),k8s.namespace.name=$(K8S_NAMESPACE),k8s.pod.name=$(K8S_POD_NAME),k8s.node.name=$(K8S_NODE_NAME)"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          # The server only serves /graphql and /playground; / returns 404
          readinessProbe:
            httpGet:
              path: /playground
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /playground
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  # Named "graphql" because frontend/nginx.conf proxies to http://graphql:8080
  name: graphql
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /playground
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: graphql-gateway
  type: ClusterIP
