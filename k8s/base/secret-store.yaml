# Where External Secrets Operator reads secrets from. No auth block: the ESO
# controller uses its own Pod Identity role (terraform/eks-cluster/secrets.tf),
# which can only read this environment's go-micro-shop/<env>/* secrets.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-north-1
