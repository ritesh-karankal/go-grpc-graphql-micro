apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
      # Scraped by the prometheus-community/prometheus chart (kubernetes-pods job)
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: /metrics
    spec:
      # preStop sleep (15s) + draining in-flight requests (up to 10s, lifecycle.DrainTimeout)
      # + flushing telemetry (up to 5s) must fit in here
      terminationGracePeriodSeconds: 30
      containers:
        - name: order-service
          image: order
          imagePullPolicy: IfNotPresent
          # Keep serving while the load balancer and Service endpoints stop routing here;
          # SIGTERM (and draining) only starts after this
          lifecycle:
            preStop:
              sleep:
                seconds: 15
          ports:
            - containerPort: 8080
              name: grpc
            - containerPort: 9464
              name: metrics
          # OTEL_EXPORTER_OTLP_ENDPOINT and DEPLOYMENT_ENVIRONMENT (k8s/base/kustomization.yaml)
          envFrom:
            - configMapRef:
                name: otel-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: order-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: order-db-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: order-db-secret
                  key: POSTGRES_DB
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@order-db-service:5432/$(POSTGRES_DB)?sslmode=disable"
            - name: ACCOUNT_SERVICE_URL
              value: "account-service-headless:8080"
            - name: CATALOG_SERVICE_URL
              value: "catalog-service-headless:8080"
            # Tag every span, metric and log with where it came from. SigNoz filters and
            # groups by deployment.environment (not the newer deployment.environment.name)
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=$(DEPLOYMENT_ENVIRONMENT),k8s.namespace.name=$(K8S_NAMESPACE),k8s.pod.name=$(K8S_POD_NAME),k8s.node.name=$(K8S_NODE_NAME)"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: grpc
  selector:
    app: order-service
  type: ClusterIP

---
# Headless twin of order-service: DNS returns every pod IP instead of one virtual IP, so gRPC
# clients (round_robin) spread requests over all replicas. A ClusterIP Service balances
# connections, and gRPC keeps one connection open, so it pinned each client to one pod.
apiVersion: v1
kind: Service
metadata:
  name: order-service-headless
spec:
  clusterIP: None
  ports:
    - port: 8080
      targetPort: 8080
      name: grpc
  selector:
    app: order-service
