# Database credentials synced from AWS Secrets Manager (created by terraform/eks-cluster/secrets.tf).
# ESO writes them into the Kubernetes Secrets the database and service pods already reference.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: account-db-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: account-db-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: go-micro-shop/dev/account-db

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: order-db-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: order-db-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: go-micro-shop/dev/order-db
