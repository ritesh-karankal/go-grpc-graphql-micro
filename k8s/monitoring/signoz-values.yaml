# SigNoz (traces, metrics, logs) for the go-micro-shop services.
# Runs next to Prometheus + Grafana, which stay as they are.
#
#   helm repo add signoz https://charts.signoz.io && helm repo update
#   helm upgrade --install signoz signoz/signoz -n signoz --create-namespace \
#     --version 0.145.0 -f k8s/monitoring/signoz-values.yaml
#
# The services send OTLP/gRPC to signoz-otel-collector.signoz.svc.cluster.local:4317
# (otel-config ConfigMap in k8s/base/kustomization.yaml). The release must be called
# "signoz" in namespace "signoz" for that name to resolve.
#
# Sized for the t3.large node groups in terraform/eks-cluster/envs/*.tfvars.
# Retention is set in the UI: Settings -> General.

global:
  # PVCs use the cluster default StorageClass (encrypted gp3, from the EBS CSI add-on)
  storageClass: null
  clusterName: go-micro-shop

clickhouse:
  persistence:
    size: 20Gi
  # Requests match what a load test measured (~770m CPU, ~1.2Gi while merging parts
  # after heavy ingestion), so the scheduler doesn't overpack its node. No CPU limit:
  # throttled merges fall behind and slow down queries.
  resources:
    requests:
      cpu: 500m
      memory: 1536Mi
    limits:
      memory: 3Gi
  # ClickHouse's own debug logs wrote ~20x more rows than our telemetry (5 min:
  # trace_log 402k, asynchronous_metric_log 82k, zookeeper_log 75k, processors_profile_log
  # 33k vs ~28k spans), and every insert means merges: most of its idle CPU. SigNoz
  # doesn't use them. query_log and part_log stay (cheap, useful for debugging).
  # The "z_" prefix makes this file load after the operator's 01-clickhouse-*.xml.
  files:
    config.d/z_disable_noisy_system_logs.xml: |
      <clickhouse>
        <trace_log remove="1"/>
        <asynchronous_metric_log remove="1"/>
        <zookeeper_log remove="1"/>
        <processors_profile_log remove="1"/>
        <metric_log remove="1"/>
      </clickhouse>
  zookeeper:
    # The chart's default Java heap is 1024 MB, which can't fit a 512Mi container
    # limit (the pod would be OOM-killed). 256 MB is plenty for one ClickHouse node.
    heapSize: 256
    resources:
      requests:
        cpu: 50m
        memory: 384Mi
      limits:
        memory: 512Mi

signoz:
  # Stays ClusterIP: switching it to LoadBalancer would also publish the internal
  # gRPC (8085) and OpAMP (4320) ports. signoz-ui-service.yaml exposes only the UI.
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

otelCollector:
  # In-cluster only; nothing outside the VPC needs to send telemetry
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
